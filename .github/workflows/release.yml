name: Release

# A tag v1.2.3 builds the signed APK of version 1.2.3 and publishes it as a GitHub release; the
# version in gradle.properties must be 1.2.3. Started by hand, the workflow builds the version of
# gradle.properties and keeps the APK as an artifact only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # The whole history with tags: the release notes and the check of the version code need the
      # previous release tag. The token is not kept in git config: the Gradle build does not need it,
      # and the release step passes it to gh directly.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # Spaces around '=' are allowed, as Gradle reads the file.
      - name: Read the version
        run: |
          version=$(sed -n -E 's/^[[:space:]]*post\.version[[:space:]]*=[[:space:]]*//p' gradle.properties | tr -d '\r' | sed -E 's/[[:space:]]+$//')
          code=$(sed -n -E 's/^[[:space:]]*post\.versionCode[[:space:]]*=[[:space:]]*//p' gradle.properties | tr -d '\r' | sed -E 's/[[:space:]]+$//')
          if [ -z "$version" ] || [ -z "$code" ]; then
            echo "gradle.properties has no post.version or post.versionCode" >&2
            exit 1
          fi
          case "$code" in *[!0-9]*)
            echo "post.versionCode '$code' is not a number" >&2
            exit 1 ;;
          esac
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "The tag $GITHUB_REF_NAME is not v$version of gradle.properties" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"
      # Every release raises the version code (docs/spec/distribution.md, D1): an updater that
      # compares codes sees no update otherwise. The Gradle build checks that the code matches the
      # version; this step checks it against the nearest earlier release tag. The tag of this version
      # itself is left out, so a manual run on a released commit compares with the release before.
      - name: Check the version code against the previous release
        run: |
          # Only "no earlier tag" skips the check: a failing git command stops the run (bash -e), and
          # grep's "no match" is the only status that is tolerated.
          tags=$(git tag --list 'v*' --merged HEAD)
          earlier=$(printf '%s\n' "$tags" | grep -vxF -e "v$VERSION" -e '' || true)
          if [ -z "$earlier" ]; then
            echo "No earlier release tag; nothing to compare"
            exit 0
          fi
          previous=$(git describe --tags --abbrev=0 --match 'v*' --exclude "v$VERSION" HEAD)
          previous_code=$(git show "$previous:gradle.properties" | sed -n -E 's/^[[:space:]]*post\.versionCode[[:space:]]*=[[:space:]]*//p' | tr -d '\r' | sed -E 's/[[:space:]]+$//')
          case "$previous_code" in ''|*[!0-9]*)
            echo "Cannot read post.versionCode of $previous: '$previous_code'" >&2
            exit 1 ;;
          esac
          # A failed comparison falls into the else branch, so it never passes by mistake.
          if [ "$VERSION_CODE" -gt "$previous_code" ]; then
            echo "post.versionCode $VERSION_CODE is greater than $previous_code of $previous"
          else
            echo "post.versionCode $VERSION_CODE is not greater than $previous_code of $previous" >&2
            exit 1
          fi
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # Tests run before the key is on disk and without the signing secrets in their environment.
      - name: Test
        run: ./gradlew :core:test testDebugUnitTest
      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.POST_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "The secret POST_KEYSTORE_BASE64 is missing" >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/post-release.jks"
          chmod 600 "$RUNNER_TEMP/post-release.jks"
          echo "POST_KEYSTORE=$RUNNER_TEMP/post-release.jks" >> "$GITHUB_ENV"
      - name: Build
        env:
          POST_KEYSTORE_PASSWORD: ${{ secrets.POST_KEYSTORE_PASSWORD }}
          POST_KEY_ALIAS: ${{ secrets.POST_KEY_ALIAS }}
          POST_KEY_PASSWORD: ${{ secrets.POST_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease
          mv app/build/outputs/apk/release/app-release.apk "post-$VERSION.apk"
          echo "APK=post-$VERSION.apk" >> "$GITHUB_ENV"
      # Obtainium refuses an update signed with another key, and users pin this certificate in
      # "Expected signing certificate hashes" (README). apksigner fails on an unsigned APK; the
      # digest check fails on any other key.
      - name: Check the signature
        run: |
          set -o pipefail
          expected=0d0640fd9b05e2b482b9260ad2d26d1ac7541f8dd5d98945239bda59cb24ff57
          # The newest build-tools on the runner.
          apksigner=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner | sort -V | tail -1)
          if [ -z "$apksigner" ]; then
            echo "No apksigner under $ANDROID_HOME/build-tools" >&2
            exit 1
          fi
          "$apksigner" verify --print-certs "$APK" | tee "$RUNNER_TEMP/certs.txt"
          # build-tools 36 print "Signer #1 certificate SHA-256 digest: <hex>", 37 print it per scheme:
          # "V2 Signer: certificate SHA-256 digest: <hex>", "V3.0 Signer: ...". Every certificate
          # printed must be the release one, and there must be at least one.
          digests=$(sed -n 's/^.* certificate SHA-256 digest: //p' "$RUNNER_TEMP/certs.txt" | sort -u)
          if [ "$digests" != "$expected" ]; then
            echo "The APK is signed by '$digests', not only by the release certificate $expected" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APK }}
          path: ${{ env.APK }}
          if-no-files-found: error
      # The only asset is the APK (D3). A tag with a suffix, v1.2.3-rc.1, is published as a
      # pre-release (D2).
      - if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=
          case "$GITHUB_REF_NAME" in *-*) prerelease=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" "$APK" --title "Post $VERSION" --generate-notes $prerelease
